<!--
================================================================================
 파일명   : JQueryAjax/1.html
 주제     : jQuery $.ajax 로 text 형식의 응답 받기
 대상     : 비전공자
================================================================================

 참고. jQuery 란 무엇인가

   자바스크립트를 더 짧게 쓸 수 있도록 만들어진 "도구 모음 파일" 입니다.
   2010년 전후에 만들어진 거의 모든 웹사이트가 이것을 사용했습니다.

   지금 실무에서 새로 만드는 프로젝트는 fetch 를 사용하지만,
   기존에 만들어진 JSP 프로젝트를 유지보수하려면 jQuery 를 반드시 읽을 줄 알아야 합니다.

 참고. 문법 비교

   [기본 자바스크립트]   document.getElementById("v1").value
   [jQuery]              $("#v1").val()

   [기본 자바스크립트]   document.getElementById("result").textContent = "값"
   [jQuery]              $("#result").text("값")

   $ 는 jQuery 라는 이름의 줄임말입니다.
   $("선택자") 형태로 화면의 태그를 찾아옵니다.

     $("#v1")     -> id 가 v1 인 태그 하나        (# 는 id 를 의미)
     $(".box")    -> class 가 box 인 태그 전부    (. 은 class 를 의미)
     $("div")     -> 모든 div 태그

 참고. 이 화면의 동작 순서

   [브라우저] 1.html
       |
       | (1) 값 10, 20 입력 후 [계산] 버튼 클릭
       | (2) $.ajax 로 calc.jsp?v1=10&v2=20 요청
       V
   [톰캣서버] calc.jsp
       |
       | (3) 30 이라는 값만 응답 (HTML 태그 없음)
       V
   [브라우저] 1.html
       |
       | (4) success 콜백함수가 자동 실행되며 response 에 30 이 담겨 옴
       | (5) <div id="result"> 영역에만 표시
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>jQuery $.ajax 로 text 응답받는 1.html 화면</title>

	<!--
		jQuery 문법을 사용하기 위해 jQuery 파일을 먼저 불러옵니다.

		이 한 줄이 없으면 $ 를 사용하는 모든 코드에서
		"$ is not defined" 오류가 발생합니다.

		주의. 이 주소는 인터넷에 있는 파일이므로
		      인터넷이 끊긴 환경에서는 동작하지 않습니다.
		      실무에서는 파일을 다운로드해서 프로젝트 안에 넣어 두기도 합니다.
	-->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<style type="text/css">
		body   { font-family:'Malgun Gothic'; padding:24px; background:#f7f9fc; }
		h2     { color:#1d5fa8; }
		.box   { background:#fff; border:1px solid #cbd5e2; border-radius:8px; padding:20px; max-width:620px; }
		input  { padding:6px; border:1px solid #93a5bd; border-radius:4px; width:120px; }
		button { background:#1d5fa8; color:#fff; border:none; padding:8px 18px;
		         border-radius:6px; cursor:pointer; margin-top:8px; }
		#result{ margin-top:14px; padding:12px; background:#e8f0fb; border-radius:6px;
		         color:#1d5fa8; font-weight:bold; min-height:22px; }
		.note  { color:#6b7c93; font-size:13px; margin-top:12px; }
	</style>
<body>
	<h2>1. JQuery $.ajax() 함수 - text 형식으로 응답받기</h2>
	
	<div class="box">
		값1 입력: <input type="text" name="v1" id="v1" value="10"><br><br>
		값2 입력: <input type="text" name="v2" id="v2" value="20"><br>
		
		<button id="cal">계산 요청</button>
		
		<!-- 계산 결과가 표시될 영역 -->
		<div id="result">
			
		</div>
		<p class="note">계산 요청 버튼을 눌러도 웹 브라우저 화면이 새로고침 되지 않고 결과 영역에 텍스트가 추가됨.
					<br>웹 브라우저 주소 창에 요청한 주소도 바뀌지 않음.</p>
						
	</div>
	<script type="text/javascript">
		// 1. 계산 요청 버튼에 클릭 이벤트 추가
		$("#cal").on("click", function(){
			// $.ajax(): 톰캣 서버 페이지에 비동기 통신 요청
			// GET, POST 같은 HTTP 프로토콜 방식으로 서버 페이지에 비동기 통신을 요청
			$.ajax({
				url: "calc.jsp",
				type: "GET",
				data: { v1: $("#v1").val(),
						v2: $("#v2").val()},
				dataType: "text",
				success: function(response){
					console.log(response);
					$("#result").text("계산 결과: " + response);
					
				},
				error: function(xhttp, status, error){
					$("#result").text("요청에 실패했습니다." + xhttp.status);
				},
				complete: function(){
					console.log("요청 완료");
				}
			});
		});
	</script>
	
</body>
</html>
