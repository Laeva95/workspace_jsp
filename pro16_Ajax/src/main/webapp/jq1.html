<!--
================================================================================
 파일명   : jq1.html
 단계     : 1단계 jQuery 버전 - 좌표를 고정해서 날씨 조회하기
 짝 파일  : step1.html (fetch 버전)
 대상     : 비전공자
================================================================================

 이 파일의 목적
 ==========================================================================
 step1.html 과 화면도 동작도 완전히 같습니다. 문법만 jQuery 로 바꾼 것입니다.
 두 파일을 나란히 열어 놓고 비교하면 차이가 한눈에 보입니다.


 참고. 왜 두 가지를 다 배우는가
 ==========================================================================

   [jQuery]
     2010년 전후에 만들어진 거의 모든 웹사이트가 사용했습니다.
     회사에 들어가면 기존에 만들어진 JSP 프로젝트를 유지보수하게 되는데,
     그 코드가 대부분 jQuery 로 되어 있습니다. 읽을 줄 알아야 합니다.

   [fetch]
     지금 새로 만드는 프로젝트의 표준입니다.
     브라우저에 기본으로 들어 있어 따로 불러올 파일이 없습니다.

   정리
     기존 코드를 고칠 때는 jQuery, 새로 만들 때는 fetch 를 씁니다.


 참고. 이 화면의 동작 순서 (step1.html 과 동일)
 ==========================================================================

   [브라우저]  jq1.html
       |
       | (1) 조회 버튼 클릭
       | (2) $.ajax 로 Open-Meteo 서버에 요청
       V
   [Open-Meteo 서버]
       |
       | (3) 현재 날씨를 JSON 으로 응답
       V
   [브라우저]
       |
       | (4) success 콜백함수가 자동 실행되며 결과 영역에만 표시


 참고. 가장 큰 문법 차이 세 가지
 ==========================================================================

   1. jQuery 는 파일을 먼저 불러와야 합니다. fetch 는 그럴 필요가 없습니다.

   2. 오류 처리 방식이 다릅니다.
        jQuery : success, error, complete 라는 세 칸에 나눠 씁니다.
        fetch  : try, catch, finally 라는 세 블록에 나눠 씁니다.

   3. 상태 검사 방식이 다릅니다.
        jQuery : 404, 500 이 오면 자동으로 error 로 넘어갑니다.
        fetch  : res.ok 를 개발자가 직접 검사해야 합니다.
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>1단계 jQuery 버전 - 좌표로 날씨 조회하기</title>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<style type="text/css">
		/* 화면을 꾸미는 부분입니다. step1.html 과 완전히 같습니다. */
		body    { font-family:'Malgun Gothic'; padding:24px; background:#f4f7fb; }
		h2      { color:#1d5fa8; }
		.box    { background:#fff; border:1px solid #d5e0ec; border-radius:10px;
		          padding:22px; max-width:620px; }
		button  { background:#7c3aed; color:#fff; border:none; padding:10px 20px;
		          border-radius:7px; cursor:pointer; font-size:14px; }
		button:disabled { background:#a89ac4; cursor:not-allowed; }
		#result { margin-top:18px; padding:20px; background:#f3eeff; border-radius:8px;
		          min-height:60px; }
		.temp   { font-size:44px; font-weight:bold; color:#0f1c2e; }
		.sub    { font-size:14px; color:#4a6280; margin-top:6px; }
		.err    { color:#c0392b; font-weight:bold; }
		.note   { color:#6b7c93; font-size:13px; margin-top:14px; }
		.nav    { margin-top:16px; font-size:14px; }
		.nav a  { color:#7c3aed; font-weight:bold; text-decoration:none; margin-right:12px; }
		.pair   { background:#f3eeff; border-left:4px solid #7c3aed; border-radius:0 8px 8px 0;
		          padding:12px 14px; margin-bottom:14px; font-size:13.5px; color:#5b3a9e; }
	</style>
</head>
<body>

<h2>1단계 jQuery 버전 - 좌표를 고정해서 날씨 조회하기</h2>

<div class="box">

	<div class="pair">
		<b>짝 파일 : step1.html (fetch 버전)</b><br>
		두 파일을 나란히 열어 놓고 코드를 비교해 보세요. 화면과 동작은 완전히 같습니다.
	</div>

	<!--
		id="btn" : 자바스크립트가 이 버튼을 찾을 때 쓰는 이름표입니다.

		여기서도 onclick 속성을 쓰지 않았습니다.
		아래 스크립트에서 $("#btn").on("click", ...) 으로 이벤트를 등록합니다.
		화면 태그와 동작 코드를 분리하는 것이 실무 권장 방식입니다.
	-->
	<button id="btn" onclick="날씨조회();">서울 날씨 조회</button>

	<!-- 서버에서 받은 결과를 끼워 넣을 빈 그릇입니다. -->
	<div id="result">버튼을 눌러 보세요.</div>

	<p class="note">F12 Network 탭을 열어 두면 요청과 응답을 직접 볼 수 있습니다.
	   fetch 버전과 요청 내용이 완전히 같은 것을 확인해 보세요.</p>

	<div class="nav">
		<a href="index.html">처음으로</a>
		<a href="step1.html">fetch 버전 보기</a>
		<a href="compare.html">문법 대조표</a>
		<a href="jq2.html">2단계로 넘어가기</a>
	</div>
</div>

<script type="text/javascript">
// 위도 latitude
// 경도 longitude
// 항목 current -> temperature_2m, relative_humidity_2m, apparent_temperature, wind_speed_10m
// 시간대 timezone
const 위도 = 37.5665;
const 경도 = 126.9780;

function 날씨조회(){
	// 자주 사용하는 태그를 상수에 저장
	const 결과영역 = $("#result");
	const 버튼 = $("#btn");
	
	버튼.prop("disabled", true);
	결과영역.text("날씨를 불러오는 중입니다...");
	
	// 요청 주소 생성
	$.ajax({
		url: "https://api.open-meteo.com/v1/forecast", 		// 외부 사이트 주소
		type: "GET",										// 요청 전송 방식 설정
		data: { 											// 조회 요청시 사용할 요청 데이터
				latitude: 위도,
				longitude: 경도,
				current: "temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m",
				timezone: "Asia/Seoul"
			},
		dataType: "json",									// 서버 페이지가 응답할 것으로 예상되는 데이터 유형
		success: function(response){						// 요청 성공시 호출되는 콜백 함수
			console.log(response)
			// 현재 날씨값들이 담긴 current 객체를 꺼내서 저장
			const 현재 = response.current;
			
			const html = `
					<div style='font-size:16px;color:blue;font-weight:bold'>서울</div>
					<div class='temp'>${현재.temperature_2m}&deg;C</div>								
					<div class='sub'>체감온도 ${현재.apparent_temperature}&deg;C &nbsp;|&nbsp;			
									습도 ${현재.relative_humidity_2m}% &nbsp;|&nbsp;					
									풍속 ${현재.wind_speed_10m}km/h</div>								
					<div class='sub'>기준 시각 ${현재.time.replace("T", " ")}</div>`;					
			결과영역.html(html);
		},
		error: function(xhttp, status, error){				// 요청 실패시 호출되는 콜백 함수
			결과영역.html('<span class="err">날씨를 불러오지 못했습니다.(상태코드): ' + xhttp.status + '</span>');
			console.log(status, error);
		},
		complete: function(){								// 요청 결과와 무관하게 무조건 실행되는 콜백 함수
			버튼.prop("disabled", false);
		}
	});
	
	
}

</script>

</body>
</html>
